<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Browser test suite for EJEC License Generator" />
  <meta name="robots" content="noindex, nofollow" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self';
                 script-src 'self';
                 style-src 'self' 'unsafe-inline';
                 img-src 'self';
                 font-src 'none';
                 connect-src 'none';
                 form-action 'none';
                 frame-ancestors 'none';
                 base-uri 'self';" />
  <title>EJEC — Browser Tests</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      color-scheme: light dark;
      --bg: #f2f2f7;
      --surface: #fff;
      --text: #1c1c1e;
      --text2: #636366;
      --border: rgba(0,0,0,.12);
      --pass: #34c759;
      --pass-bg: rgba(52,199,89,.12);
      --fail: #ff3b30;
      --fail-bg: rgba(255,59,48,.10);
      --accent: #007aff;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #000;
        --surface: #1c1c1e;
        --text: #f2f2f7;
        --text2: #aeaeb2;
        --border: rgba(255,255,255,.12);
        --pass: #30d158;
        --pass-bg: rgba(48,209,88,.15);
        --fail: #ff453a;
        --fail-bg: rgba(255,69,58,.15);
        --accent: #0a84ff;
      }
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text",
                   "Helvetica Neue", Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 24px 16px;
      min-height: 100dvh;
    }
    .wrapper { max-width: 720px; margin: 0 auto; }
    h1 {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 6px;
    }
    .meta {
      font-size: 13px;
      color: var(--text2);
      margin-bottom: 24px;
    }
    #results {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .summary {
      font-size: 15px;
      font-weight: 600;
      padding: 12px 16px;
      border-radius: 10px;
      margin-bottom: 12px;
    }
    .summary-pass { background: var(--pass-bg); color: var(--pass); }
    .summary-fail { background: var(--fail-bg); color: var(--fail); }

    .test-row {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      font-size: 13px;
      padding: 9px 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--surface);
    }
    .test-icon {
      font-weight: 700;
      font-size: 14px;
      flex-shrink: 0;
      width: 18px;
    }
    .pass .test-icon { color: var(--pass); }
    .fail .test-icon { color: var(--fail); }
    .pass { border-color: var(--pass-bg); }
    .fail { background: var(--fail-bg); border-color: var(--fail); }

    .test-label { flex: 1; }
    .test-detail {
      color: var(--fail);
      font-size: 11px;
      font-family: ui-monospace, "SF Mono", Menlo, monospace;
      margin-top: 2px;
      word-break: break-all;
    }

    footer {
      margin-top: 32px;
      font-size: 12px;
      color: var(--text2);
    }
    footer a { color: var(--accent); }
  </style>
</head>
<body>
<div class="wrapper">
  <h1>🧪 EJEC License Generator — Browser Tests</h1>
  <p class="meta">
    Tests run automatically on load. No build step, no external dependencies.<br />
    <a href="../index.html">← Back to License Generator</a>
  </p>

  <div id="results" aria-live="polite" role="region" aria-label="Test results">
    <p style="color:var(--text2);font-size:13px;">Running tests…</p>
  </div>

  <footer>
    <p>All tests run in-browser via Web Crypto API. No data leaves your device.</p>
  </footer>
</div>

<!-- Load the production app module (exposes window.__ejec__) -->
<script src="../app.js"></script>
<!-- Then load and run the test suite -->
<script src="license-tests.js"></script>
</body>
</html>
